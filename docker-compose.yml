services:

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  app1:
    build: ./app1
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "3001:3001"

  app2:
    build: ./app2
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "3002:3002"