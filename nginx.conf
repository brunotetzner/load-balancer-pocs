# weight- coloca pesos maiores para servidores
events {}

http {
    upstream backend {
        server app1:3001 weight=3;
        server app2:3002;
    }
# 
    server {
        listen 80;
# 
        location / {
            proxy_pass http://backend;
        }
    }
}